# Check type WORLD_CHECK. The frontend renders its form from this file; changing a field needs no database migration.
# Field types: text, textarea, date, number, pin, phone, aadhaar, pan, uan, boolean, select, repeatable.
code: WORLD_CHECK
order: 14
displayName: "World Check"
documentName: "Global Database"
iconGroup: unique
attestationDefault: false
verificationTypeDefault: Electronic
fields:
  - { key: sources_searched, label: "Sources Searched", type: textarea }
  - { key: search_date, label: "Search Date", type: date }
  - { key: hits_found, label: "Hits Found", type: boolean }
  - { key: result_summary, label: "Result Summary", type: textarea }
details: []   # the standard details (verification type, document type, dates) are added automatically
