spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

nexlyn:
  storage:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION:ap-south-1}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
