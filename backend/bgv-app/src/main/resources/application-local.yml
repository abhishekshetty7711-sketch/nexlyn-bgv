spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexlyn_bgv}
    username: ${DB_USERNAME:nexlyn}
    password: ${DB_PASSWORD:nexlyn}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  level:
    com.nexlyn.bgv: DEBUG

nexlyn:
  auth:
    cookie:
      secure: false # plain http on localhost; prod keeps the default (true)
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:nexlyn-bgv}
    access-key: ${S3_ACCESS_KEY:local}
    secret-key: ${S3_SECRET_KEY:local-dev-secret}
    region: ${S3_REGION:ap-south-1}
    path-style: true
    server-side-encryption: false
    create-bucket: true
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  swagger-ui:
    enabled: true
