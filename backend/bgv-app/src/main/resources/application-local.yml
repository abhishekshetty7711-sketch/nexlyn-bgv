spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexlyn_bgv}
    username: ${DB_USERNAME:nexlyn}
    password: ${DB_PASSWORD:nexlyn}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  level:
    com.nexlyn.bgv: DEBUG

nexlyn:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:nexlyn-bgv}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:ap-south-1}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  swagger-ui:
    enabled: true
