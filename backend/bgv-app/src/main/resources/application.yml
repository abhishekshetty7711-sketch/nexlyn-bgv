spring:
  application:
    name: bgv-app
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
  modulith:
    events:
      jdbc:
        schema: modulith
  servlet:
    multipart:
      # A little above the per-file limit below, so the friendly message comes from the documents module.
      max-file-size: 12MB
      max-request-size: 13MB

server:
  port: 8080

nexlyn:
  auth:
    bootstrap:
      # First start only, and only when no admin exists. Set in the environment, never in git.
      email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
    jwt:
      # RS256 private key as PEM (newlines may be written as backslash-n). Required in prod.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      key-id: ${JWT_KEY_ID:}
    totp:
      # Base64 of 32 random bytes. Required in prod.
      encryption-key: ${TOTP_ENCRYPTION_KEY:}

  cases:
    # Base64 of 32 random bytes. Encrypts Aadhaar, PAN and UAN values at rest. Required in prod.
    pii-encryption-key: ${PII_ENCRYPTION_KEY:}

  storage:
    # An S3-compatible bucket for uploaded files (AWS S3 in prod, a local store in development).
    # Blank endpoint = AWS. Blank access key = the AWS default credential chain (an IAM role).
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-south-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:false}
    server-side-encryption: ${S3_SSE:true}
    create-bucket: ${S3_CREATE_BUCKET:false}

  documents:
    max-bytes: 10485760

management:
  endpoints:
    web:
      exposure:
        include: health
