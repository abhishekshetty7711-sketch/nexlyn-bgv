name: nexlyn-bgv

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexlyn_bgv}
      POSTGRES_USER: ${DB_USERNAME:-nexlyn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexlyn_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexlyn} -d ${DB_NAME:-nexlyn_bgv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The default local file store: SeaweedFS with its S3 API (the app only speaks S3, so AWS S3 in prod needs
  # no code change). MinIO below is kept for anyone who has a working image (profile "storage").
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=128 -volume.max=20
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
      # Signed requests are refused unless an identity is configured; these are throw-away local credentials.
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    # MinIO is behind the "storage" profile: its public images were withdrawn, so it is
    # off by default. Enable with: docker compose --profile storage up (needs a working image).
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./minio/init:/init:ro
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: bgv-app/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexlyn_bgv}
      DB_USERNAME: ${DB_USERNAME:-nexlyn}
      DB_PASSWORD: ${DB_PASSWORD:-nexlyn_dev_password}
      # Local file store (private: only reachable inside the compose network unless the port above is published).
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: ${S3_BUCKET:-nexlyn-bgv}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-secret}
      S3_PATH_STYLE: "true"
      S3_SSE: "false"
      S3_CREATE_BUCKET: "true"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  miniodata:
  storagedata:
