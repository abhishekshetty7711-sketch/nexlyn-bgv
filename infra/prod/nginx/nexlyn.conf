# The public entry point (CLAUDE.md sections 3.3 and 11.4): TLS, redirect from http, request limits, rate
# limits on sign-in. /api and the health check go straight to the backend; everything else to the web app
# container (which serves the built files). Host name: nexlynservices.com (see README).

# Per-client-address rate limits. The sign-in endpoints are far stricter than the rest of the API; the
# backend has its own per-address and per-account limits as well (a second, independent layer).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

# ---- http: only the certificate check and a redirect ------------------------------------------------------------
server {
    listen 8080 default_server;   # (Docker publishes it as port 80)
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;   # for Let's Encrypt renewals (webroot method)
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- https ---------------------------------------------------------------------------------------------------------
server {
    listen 8443 ssl default_server;   # (Docker publishes it as port 443)
    http2 on;
    server_name nexlynservices.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Two years of "only ever use https for this site".
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 10 MB files plus form overhead; anything bigger is refused before it reaches the application.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn perip 30;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API's real client address is the connection's address (not anything the caller sent).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Sign-in, two-step code, token refresh, invitations: at most 10 tries a minute per address (short bursts allowed).
    location /api/auth/ {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass http://backend:8080;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8080;
        # the report preview can be large (it carries the pictures)
        proxy_read_timeout 90s;
    }

    # Only the health check of the actuator is public; the app itself exposes nothing else.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        access_log off;
    }
    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
